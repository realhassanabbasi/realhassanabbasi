<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1280" height="400" fill="#0a0a0a"/>
  <!-- kicker -->
  <circle cx="80" cy="102" r="7" fill="#f5f5f5">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="102" y="111" font-family="'Courier New', Courier, monospace" font-size="25" letter-spacing="9" fill="#6e6e6e">AI ENGINEER</text>
  <!-- name -->
  <text x="76" y="232" font-size="116" font-weight="800" letter-spacing="1" fill="#f5f5f5">HASSAN ABBASI
    <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="1.1s" fill="freeze"/>
  </text>
  <!-- drawing rule -->
  <line x1="80" y1="272" x2="1200" y2="272" stroke="#3d3d3d" stroke-width="2" stroke-dasharray="1120" stroke-dashoffset="1120">
    <animate attributeName="stroke-dashoffset" from="1120" to="0" dur="1.6s" begin="0.4s" fill="freeze"/>
  </line>
  <!-- cycling statements -->
  <text x="80" y="332" font-family="'Courier New', Courier, monospace" font-size="29" fill="#a3a3a3" opacity="0">I build AI-powered products with excellent UX.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.28;0.36" dur="9s" repeatCount="indefinite"/></text>
  <text x="80" y="332" font-family="'Courier New', Courier, monospace" font-size="29" fill="#a3a3a3" opacity="0">Creator of PromptSmith — 40 tests green, zero dependencies.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.28;0.36" dur="9s" begin="-3s" repeatCount="indefinite"/></text>
  <text x="80" y="332" font-family="'Courier New', Courier, monospace" font-size="29" fill="#a3a3a3" opacity="0">Making AI actually useful, one prompt at a time.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.28;0.36" dur="9s" begin="-6s" repeatCount="indefinite"/></text>
  <!-- corner mark -->
  <text x="1200" y="368" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="20" letter-spacing="4" fill="#4a4a4a">ISLAMABAD — 2026</text>
</svg>
